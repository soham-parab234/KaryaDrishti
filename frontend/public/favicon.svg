<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- LMIS Brand Favicon SVG -->
  <defs>
    <clipPath id="circle-lens">
      <circle cx="44" cy="44" r="21" />
    </clipPath>
  </defs>
  
  <!-- Upward Trend Chart Bars -->
  <rect x="44" y="20" width="5" height="14" rx="1.5" fill="#292524" />
  <rect x="52" y="14" width="5" height="20" rx="1.5" fill="#292524" />
  <rect x="60" y="8" width="5" height="26" rx="1.5" fill="#292524" />
  
  <!-- Growth Arrow -->
  <path d="M 38 24 Q 52 18 64 6" fill="none" stroke="#b43b12" stroke-width="4" stroke-linecap="round" />
  <polygon points="64,2 68,9 59,8" fill="#b43b12" />

  <!-- Magnifying Glass Lens Handle -->
  <path d="M 59 59 L 75 75" stroke="#b43b12" stroke-width="9" stroke-linecap="round" />

  <!-- Lens Outer Ring -->
  <circle cx="44" cy="44" r="23" fill="#ffffff" stroke="#b43b12" stroke-width="5.5" />

  <!-- People inside Magnifying Glass -->
  <g clip-path="url(#circle-lens)">
    <!-- Left Person (Green) -->
    <circle cx="33" cy="38" r="4.5" fill="#587e63" />
    <path d="M 24 55 Q 33 46 42 55 Z" fill="#587e63" />

    <!-- Right Person (Terracotta) -->
    <circle cx="55" cy="40" r="4" fill="#b43b12" />
    <path d="M 47 56 Q 55 48 63 56 Z" fill="#b43b12" />

    <!-- Center Foreground Person (Charcoal) -->
    <circle cx="44" cy="34" r="5.5" fill="#1c1917" />
    <path d="M 32 56 Q 44 44 56 56 Z" fill="#1c1917" />
  </g>

  <!-- AI Processor Module -->
  <!-- Circuit Nodes -->
  <line x1="74" y1="33" x2="74" y2="38" stroke="#1c1917" stroke-width="1.8" />
  <circle cx="74" cy="32" r="1.8" fill="#1c1917" />
  <line x1="84" y1="36" x2="88" y2="34" stroke="#1c1917" stroke-width="1.8" />
  <circle cx="89" cy="33" r="1.8" fill="#1c1917" />
  <line x1="86" y1="44" x2="93" y2="44" stroke="#1c1917" stroke-width="1.8" />
  <circle cx="94" cy="44" r="1.8" fill="#1c1917" />
  <line x1="84" y1="52" x2="88" y2="54" stroke="#1c1917" stroke-width="1.8" />
  <circle cx="89" cy="55" r="1.8" fill="#1c1917" />
  <line x1="74" y1="54" x2="74" y2="59" stroke="#1c1917" stroke-width="1.8" />
  <circle cx="74" cy="60" r="1.8" fill="#1c1917" />
  <line x1="79" y1="54" x2="79" y2="61" stroke="#1c1917" stroke-width="1.8" />
  <circle cx="79" cy="62" r="1.8" fill="#1c1917" />

  <!-- AI Chip Square -->
  <rect x="65" y="38" width="18" height="18" rx="3.5" fill="#b43b12" />
  <text x="74" y="51" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" text-anchor="middle">AI</text>

  <!-- LMIS Wordmark -->
  <text x="50" y="93" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" text-anchor="middle" letter-spacing="-0.02em">
    <tspan fill="#1c1917">LM</tspan><tspan fill="#b43b12">I</tspan><tspan fill="#1c1917">S</tspan>
  </text>
</svg>